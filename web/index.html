<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="film_maker">

  <title>film_maker</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // IndexedDB-backed image store — keeps picked images alive across page reloads.
    window.filmMakerImageStore = (function () {
      const DB_NAME = 'filmMakerImages';
      const STORE   = 'images';
      let _dbPromise = null;

      function getDb() {
        if (!_dbPromise) {
          _dbPromise = new Promise(function (resolve, reject) {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = function (e) {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(STORE)) {
                db.createObjectStore(STORE);
              }
            };
            req.onsuccess  = function (e) { resolve(e.target.result); };
            req.onerror    = function ()  { reject(req.error); };
          });
        }
        return _dbPromise;
      }

      return {
        store: async function (key, bytes) {
          const db = await getDb();
          return new Promise(function (resolve, reject) {
            const txn = db.transaction(STORE, 'readwrite');
            txn.objectStore(STORE).put(bytes, key);
            txn.oncomplete = function () { resolve(); };
            txn.onerror    = function () { reject(txn.error); };
          });
        },

        load: async function (key) {
          const db = await getDb();
          return new Promise(function (resolve, reject) {
            const txn = db.transaction(STORE, 'readonly');
            const req = txn.objectStore(STORE).get(key);
            req.onsuccess = function () { resolve(req.result ?? null); };
            req.onerror   = function () { reject(req.error); };
          });
        },

        delete: async function (key) {
          const db = await getDb();
          return new Promise(function (resolve) {
            const txn = db.transaction(STORE, 'readwrite');
            txn.objectStore(STORE).delete(key);
            txn.oncomplete = function () { resolve(); };
            txn.onerror    = function () { resolve(); }; // best-effort
          });
        },
      };
    })();
  </script>

  <script>
    // Global encoder helper used by the Flutter web export path.
    // Uses WebCodecs VideoEncoder + mp4-muxer (loaded on first use via dynamic import).
    window.filmMakerEncoder = {
      muxer: null,
      encoder: null,
      target: null,
      fps: 30,
      frameCount: 0,
      _error: null,
      _Mp4Muxer: null,

      init: async function (width, height, fps, bitrate) {
        this.fps = fps;
        this.frameCount = 0;
        this._error = null;

        if (typeof VideoEncoder === 'undefined') {
          throw new Error(
            'Your browser does not support video encoding. ' +
            'Please use Chrome 94+, Edge 94+, or Safari 16.4+.'
          );
        }

        if (!this._Mp4Muxer) {
          // esm.sh serves a proper ES module; use default??mod to handle both
          // ESM named exports and CJS-wrapped-as-default-export formats.
          const mod = await import('https://esm.sh/mp4-muxer@5');
          this._Mp4Muxer = mod.default ?? mod;
        }

        const { Muxer, ArrayBufferTarget } = this._Mp4Muxer;
        this.target = new ArrayBufferTarget();
        this.muxer = new Muxer({
          target: this.target,
          video: { codec: 'avc', width: width, height: height },
          fastStart: 'in-memory',
        });

        this.encoder = new VideoEncoder({
          output: (chunk, meta) => this.muxer.addVideoChunk(chunk, meta),
          error: (e) => { this._error = e.message || String(e); },
        });

        this.encoder.configure({
          codec: 'avc1.640033',
          width: width,
          height: height,
          bitrate: bitrate,
          framerate: fps,
          hardwareAcceleration: 'prefer-hardware',
        });
      },

      addFrame: async function (rgbaBytes, width, height) {
        if (this._error) throw new Error(this._error);
        const ts = Math.round(this.frameCount * 1000000 / this.fps);
        const imageData = new ImageData(new Uint8ClampedArray(rgbaBytes), width, height);
        const bitmap = await createImageBitmap(imageData);
        const frame = new VideoFrame(bitmap, {
          timestamp: ts,
          duration: Math.round(1000000 / this.fps),
        });
        bitmap.close();
        const keyFrame = (this.frameCount % (this.fps * 2) === 0);
        this.encoder.encode(frame, { keyFrame });
        frame.close();
        this.frameCount++;
      },

      finalize: async function () {
        if (this._error) throw new Error(this._error);
        await this.encoder.flush();
        if (this._error) throw new Error(this._error);
        this.encoder.close();
        this.muxer.finalize();
        return new Uint8Array(this.target.buffer);
      },
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
